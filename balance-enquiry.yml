openapi: 3.0.3
info:
  title: Balance enquiry
  version: "1.0"
servers:
  - url: https://openapiuat.airtel.mg
paths:
  /loan-kyc/v1/user/{msisdn}:
    get:
      summary: Balance enquiry
      security:
        - bearerAuth: []
      parameters:
        - name: msisdn
          in: path
          required: true
          schema:
            type: string
          example: "331234567"
        - name: X-Country
          in: header
          required: true
          schema:
            type: string
          example: MG
        - name: X-Currency
          in: header
          required: true
          schema:
            type: string
          example: MGA
      responses:
        "200":
          description: Success
          content:
            application/json:
              example:
                data:
                  fic: "0.00"
                  id_number: "101234567890"
                  is_barred: false
                  gender: Male
                  last_name: Rakoto
                  language: fr
                  account_status: "Y"
                  middle_name: ""
                  is_pin_set: true
                  last_pin_reset_date: ""
                  frozen_amount: "0.00"
                  nationality: MG
                  balance: "150000.00"
                  user_id: PT260101.0900.000001
                  created_on: ""
                  dob: "1990-01-15 00:00:00.0"
                  reg_status: SUBS
                  grade: SUBS
                  id_type: NATIONAL_ID
                  msisdn: "331234567"
                  first_name: Andry
                status:
                  response_code: DP03670000001
                  code: "200"
                  success: true
                  message: success
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
